[project]
name = "bytevon-crm-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]
# B008 (function call in default arg) is incompatible with the canonical
# FastAPI pattern `param: T | None = Query(None)` used across all route
# modules; ruff documents this conflict. All other bugbear rules stay on.

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "security_gate_diagnostic: temporary pre-remediation diagnostics (Phase 0.5, removed after remediation)",
]
