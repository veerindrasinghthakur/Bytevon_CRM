<style>

<body class="bg-background text-on-surface">

<!-- Branding Header -->
<div class="mb-stack-lg">
<span class="font-title-lg text-title-lg font-black text-primary tracking-tight">Bytevon</span>
</div>
<!-- Security Icon with Tonal Layers -->
<div class="mb-stack-lg relative">
<div class="w-20 h-20 bg-surface-container-high rounded-full flex items-center justify-center">
<div class="w-14 h-14 bg-surface-container-highest rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="lock_reset">lock_reset</span>
</div>
</div>

<div class="absolute bottom-1 right-1 w-4 h-4 bg-error rounded-full border-2 border-white animate-pulse"></div>
</div>
<!-- Content -->
<h1 class="font-headline-md text-headline-md text-primary mb-stack-sm">Session Expired</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg max-w-[320px]">

            </p>
<!-- Progress/Countdown Bar (Visual Detail) -->
<div class="w-full h-[2px] bg-outline-variant mb-stack-lg overflow-hidden">
<div class="h-full bg-primary w-full transform origin-left animate-[shrink_300s_linear_infinite]"></div>
</div>
<!-- Actions -->
<div class="flex flex-col w-full gap-stack-sm">
<button class="w-full bg-primary text-on-primary py-3 px-6 rounded-lg font-label-md text-label-md hover:bg-opacity-90 transition-all duration-200 shadow-sm flex items-center justify-center gap-2">

                    <span class="material-symbols-outlined text-[18px]" data-icon="login">login</span>
</button>
<button class="w-full bg-transparent text-on-surface-variant border border-outline-variant py-3 px-6 rounded-lg font-label-md text-label-md hover:bg-surface-container-low transition-all duration-200">

                </button>
</div>
<!-- Security Badge -->
<div class="mt-stack-lg flex items-center gap-2 py-2 px-4 bg-surface-container-lowest rounded-full border border-outline-variant">

<style>
        @keyframes shrink {
            from { transform: scaleX(1); }
            to { transform: scaleX(0); }
        }
        
        .animate-in {
            animation-duration: 0.5s;
            animation-fill-mode: both;
        }
        
        .fade-in {
            animation-name: fadeIn;
        }
        
        .zoom-in {
            animation-name: zoomIn;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
<script>
        // Micro-interaction for buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.style.transform = 'scale(0.98)';
            });
            button.addEventListener('mouseup', () => {
                button.style.transform = 'scale(1)';
            });
            button.addEventListener('mouseleave', () => {
                button.style.transform = 'scale(1)';
            });
        });

        // Simple interactive clock or background movement could be added here
        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;
            const card = document.querySelector('.glass-effect');
            if (card) {
                card.style.transform = `perspective(1000px) rotateY(${x * 2}deg) rotateX(${-y * 2}deg)`;
            }
        });
    </script>
