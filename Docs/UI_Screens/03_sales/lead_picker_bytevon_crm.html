<body class="bg-surface flex items-center justify-center min-h-screen p-4">

<!-- Modal Container -->

<button class="text-on-surface-variant hover:text-on-surface transition-colors p-2 rounded-full hover:bg-surface-variant">

<div class="relative w-full">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="search">search</span>

</header>
<!-- Main Content Area -->
<div class="flex flex-1 overflow-hidden">
<!-- Sidebar Filters -->

<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Prospect</span>
</label>
<label class="flex items-center gap-2 cursor-pointer group">
<input checked="" class="rounded border-outline-variant text-primary focus:ring-primary h-4 w-4 bg-surface" type="checkbox"/>

<label class="flex items-center gap-2 cursor-pointer group">

</label>
</div>
</div>
<div>

<input class="rounded border-outline-variant text-primary focus:ring-primary h-4 w-4 bg-surface" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Inbound</span>
</label>
<label class="flex items-center gap-2 cursor-pointer group">
<input class="rounded border-outline-variant text-primary focus:ring-primary h-4 w-4 bg-surface" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Referral</span>

<label class="flex items-center gap-2 cursor-pointer group">
<input class="rounded border-outline-variant text-primary focus:ring-primary h-4 w-4 bg-surface" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Outbound</span>
</label>
</div>
</div>
</aside>
<!-- List Area -->
<main class="flex-1 overflow-y-auto custom-scrollbar bg-surface relative">
<!-- Table Header (Sticky) -->
<div class="sticky top-0 bg-surface border-b border-outline-variant z-10 grid grid-cols-12 gap-gutter-md px-container-margin py-3">
<div class="col-span-1 flex items-center">
<span class="font-label-sm text-label-sm text-outline">Sel</span>
</div>
<div class="col-span-4 md:col-span-5 flex items-center">
<span class="font-label-sm text-label-sm text-outline uppercase tracking-wider">Lead Details</span>
</div>
<div class="col-span-3 md:col-span-3 flex items-center justify-end">

<span class="font-caption text-caption text-secondary truncate">Acme Corp</span>

</div>
<div class="col-span-3 md:col-span-3 flex items-center justify-end">

<span class="w-1.5 h-1.5 rounded-full bg-primary"></span>

</div>
<div class="col-span-3 md:col-span-3 flex items-center justify-end">

<span class="font-caption text-caption text-secondary truncate">TechFlow Solutions</span>
</div>
</div>
<div class="col-span-3 md:col-span-3 flex items-center justify-end">
<span class="font-body-md text-body-md text-on-surface font-medium">$85,000</span>
</div>
<div class="col-span-4 md:col-span-3 flex items-center ml-4">
<span class="inline-flex items-center px-2 py-1 rounded-full bg-surface-container-high text-on-surface font-label-sm text-label-sm gap-1">

</div>
<!-- Footer Actions -->
<footer class="p-container-margin border-t border-outline-variant bg-surface-bright flex justify-end gap-3 items-center">
<span class="text-secondary font-caption text-caption mr-auto hidden sm:inline">1 lead selected</span>
<button class="px-6 py-2 rounded-lg border border-outline-variant text-on-surface font-label-sm text-label-sm font-semibold hover:bg-surface-variant transition-colors">
                Cancel
            </button>
<button class="px-6 py-2 rounded-lg bg-primary text-on-primary font-label-sm text-label-sm font-semibold hover:bg-on-primary-fixed-variant transition-colors shadow-sm">
                Confirm Selection
            </button>
</footer>
</div>
<script>
        // Simple radio button visual toggle logic
        document.querySelectorAll('input[type="radio"][name="lead_selection"]').forEach(radio => {
            radio.addEventListener('change', function() {
                // Reset all
                document.querySelectorAll('input[type="radio"][name="lead_selection"]').forEach(r => {
                    const outerCircle = r.previousElementSibling;
                    const innerCircle = outerCircle.firstElementChild;
                    outerCircle.className = "w-5 h-5 rounded-full border border-outline-variant group-hover:border-primary flex items-center justify-center transition-colors";
                    innerCircle.className = "w-2.5 h-2.5 rounded-full bg-primary opacity-0 transition-opacity";
                });

                // Set active
                if(this.checked) {
                    const outerCircle = this.previousElementSibling;
                    const innerCircle = outerCircle.firstElementChild;
                    outerCircle.className = "w-5 h-5 rounded-full border-2 border-primary flex items-center justify-center transition-colors";
                    innerCircle.className = "w-2.5 h-2.5 rounded-full bg-primary opacity-100 transition-opacity";
                }
            });
        });
    </script>
