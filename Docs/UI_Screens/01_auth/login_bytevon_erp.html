<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Login | Bytevon ERP</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">tailwind.config = {darkMode: "class", theme: {extend: {colors: {"on-tertiary-container": "#848789", "on-primary-fixed-variant": "#2f486a", "on-error": "#ffffff", "on-tertiary": "#ffffff", "primary-fixed-dim": "#afc8f0", "tertiary-fixed": "#e0e3e5", "tertiary-fixed-dim": "#c4c7c9", "surface-bright": "#f8f9ff", "on-secondary-fixed": "#001a41", "tertiary-container": "#1c1f21", "error-container": "#ffdad6", "surface-tint": "#476083", "surface-container-low": "#eff4ff", "on-surface": "#0b1c30", "primary-container": "#001f3f", "on-tertiary-fixed": "#191c1e", tertiary: "#040607", "surface-variant": "#d3e4fe", "inverse-primary": "#afc8f0", "surface-dim": "#cbdbf5", "outline-variant": "#c4c6cf", surface: "#f8f9ff", primary: "#000613", "on-secondary-container": "#fefcff", "on-primary-container": "#6f88ad", "secondary-fixed": "#d8e2ff", outline: "#74777f", "on-background": "#0b1c30", "surface-container-highest": "#d3e4fe", "on-primary-fixed": "#001c3a", "on-tertiary-fixed-variant": "#444749", error: "#ba1a1a", "on-primary": "#ffffff", "inverse-on-surface": "#eaf1ff", "surface-container-high": "#dce9ff", "inverse-surface": "#213145", "secondary-container": "#0070ea", "primary-fixed": "#d4e3ff", "on-secondary-fixed-variant": "#004493", "secondary-fixed-dim": "#adc7ff", secondary: "#0059bb", "on-surface-variant": "#43474e", "on-secondary": "#ffffff", "on-error-container": "#93000a", "surface-container": "#e5eeff", background: "#f8f9ff", "surface-container-lowest": "#ffffff"}, borderRadius: {DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px"}, spacing: {gutter: "24px", "margin-mobile": "16px", "stack-sm": "8px", "margin-desktop": "40px", "stack-md": "16px", unit: "4px", "stack-lg": "32px", "container-max": "1440px"}, fontFamily: {"label-md": ["Inter"], "headline-lg": ["Inter"], "display-lg": ["Inter"], "body-lg": ["Inter"], "label-sm": ["Inter"], "headline-lg-mobile": ["Inter"], "title-lg": ["Inter"], "headline-md": ["Inter"], "body-sm": ["Inter"], "body-md": ["Inter"], headline: ["Inter"], display: ["Inter"], body: ["Inter"], label: ["Inter"]}, fontSize: {"label-md": ["14px", {lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "500"}], "headline-lg": ["32px", {lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "600"}], "display-lg": ["48px", {lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "700"}], "body-lg": ["18px", {lineHeight: "28px", fontWeight: "400"}], "label-sm": ["12px", {lineHeight: "16px", fontWeight: "600"}], "headline-lg-mobile": ["24px", {lineHeight: "32px", fontWeight: "600"}], "title-lg": ["20px", {lineHeight: "28px", fontWeight: "600"}], "headline-md": ["24px", {lineHeight: "32px", fontWeight: "600"}], "body-sm": ["14px", {lineHeight: "20px", fontWeight: "400"}], "body-md": ["16px", {lineHeight: "24px", fontWeight: "400"}]}}}};</script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9ff;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #E2E8F0;
        }
        .input-focus-ring:focus {
            outline: none;
            border-color: #0070ea;
            box-shadow: 0 0 0 2px rgba(0, 112, 234, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center bg-surface p-margin-mobile md:p-margin-desktop">
<!-- TopNavBar (Suppressed for focused login task as per semantic shell mandate, but used for Branding identity if needed) -->
<header class="fixed top-0 left-0 w-full flex justify-between items-center px-margin-desktop py-6">
<div class="text-title-lg font-title-lg font-black text-primary">Bytevon</div>
<button class="text-label-md font-label-md text-on-surface-variant hover:text-primary transition-colors">Support</button>
</header>
<!-- Main Content Area -->
<main class="w-full max-w-[440px] z-10">
<div class="bg-surface-container-lowest p-8 md:p-10 rounded-xl login-card-shadow transition-all duration-300">
<!-- Header Section -->
<div class="mb-stack-lg text-center">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Access your enterprise resources</p>
</div>
<!-- Validation Error State (Hidden by default, shown for demonstration) -->
<div class="hidden mb-stack-md p-4 bg-error-container rounded-lg border border-error/20 flex items-center gap-3" id="error-alert">
<span class="material-symbols-outlined text-error" data-icon="error">error</span>
<p class="font-label-sm text-label-sm text-on-error-container">Invalid username or password. Please try again.</p>
</div>
<form class="flex flex-col gap-stack-md" id="login-form">
<!-- Username Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="identity">Username or Email</label>
<div class="relative">
<input class="w-full px-4 py-3 bg-surface rounded-lg border border-outline-variant font-body-md text-body-md text-on-surface input-focus-ring transition-all" id="identity" placeholder="e.g. john.doe@bytevon.com" required="" type="text">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-secondary hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<input class="w-full px-4 py-3 bg-surface rounded-lg border border-outline-variant font-body-md text-body-md text-on-surface input-focus-ring transition-all pr-12" id="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center" id="toggle-password" type="button">
<span class="material-symbols-outlined select-none" data-icon="visibility">visibility</span>
</button>
</div>
<!-- Caps Lock Indicator -->
<div class="hidden flex items-center gap-1.5 px-1 mt-1 text-on-surface-variant" id="caps-lock-warning">
<span class="material-symbols-outlined text-[16px]" data-icon="keyboard_capslock">keyboard_capslock</span>
<span class="font-label-sm text-label-sm">Caps Lock is ON</span>
</div>
</div>
<!-- Remember Me & Checkbox -->
<div class="flex items-center gap-3 mt-1">
<div class="relative flex items-center">
<input class="w-5 h-5 rounded border-outline-variant text-secondary focus:ring-secondary cursor-pointer" id="remember" type="checkbox">
</div>
<label class="font-label-md text-label-md text-on-surface-variant cursor-pointer select-none" for="remember">Remember this device</label>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-stack-md mt-4">
<button class="w-full py-3.5 bg-primary text-on-primary font-label-md text-label-md rounded-lg hover:bg-primary-container hover:text-on-primary-container transition-all shadow-md active:scale-[0.98] flex justify-center items-center gap-2" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-[18px]" data-icon="login">login</span>
</button>
<button class="w-full py-3 bg-transparent border border-outline-variant text-on-surface-variant font-label-md text-label-md rounded-lg hover:bg-surface-container-high transition-all flex justify-center items-center gap-2" type="button">
                        Contact Administrator
                    </button>
</div>
</form>
</div>
</main>
<!-- Footer Component (Execution from JSON) -->
<footer class="w-full py-stack-lg flex flex-col items-center gap-2 mt-auto">
<div class="flex flex-col md:flex-row justify-center items-center gap-stack-md w-full py-stack-lg">
<span class="font-label-sm text-label-sm text-on-surface-variant">Version 1.2.0</span>
<span class="hidden md:block text-on-tertiary-container">•</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">© 2024 Bytevon Systems. All rights reserved.</span>
</div>
<div class="flex gap-stack-lg">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-opacity duration-200 underline" href="#">Privacy Policy</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-opacity duration-200 underline" href="#">Terms of Service</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-opacity duration-200 underline" href="#">Security Compliance</a>
</div>
</footer>
<!-- Background Decoration -->
<div class="fixed inset-0 -z-10 pointer-events-none opacity-40">
<div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-secondary-container/10 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-primary-container/5 rounded-full blur-[120px]"></div>
</div>
<script>
        // Password Visibility Toggle
        const passwordInput = document.getElementById('password');
        const toggleButton = document.getElementById('toggle-password');
        const toggleIcon = toggleButton.querySelector('.material-symbols-outlined');

        toggleButton.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
            toggleIcon.setAttribute('data-icon', type === 'password' ? 'visibility' : 'visibility_off');
        });

        // Caps Lock Detection
        const capsLockWarning = document.getElementById('caps-lock-warning');
        passwordInput.addEventListener('keydown', (event) => {
            if (event.getModifierState('CapsLock')) {
                capsLockWarning.classList.remove('hidden');
            } else {
                capsLockWarning.classList.add('hidden');
            }
        });

        // Validation Error Simulation (Mocking a failed attempt)
        const loginForm = document.getElementById('login-form');
        const errorAlert = document.getElementById('error-alert');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            // Simple visual demonstration of error state
            errorAlert.classList.remove('hidden');
            
            // Highlight borders as error
            const inputs = loginForm.querySelectorAll('input[required]');
            inputs.forEach(input => {
                input.classList.remove('border-outline-variant');
                input.classList.add('border-error');
            });

            // Smooth shake effect
            const card = document.querySelector('.login-card-shadow');
            card.classList.add('translate-x-1');
            setTimeout(() => card.classList.remove('translate-x-1'), 50);
            setTimeout(() => card.classList.add('-translate-x-1'), 100);
            setTimeout(() => card.classList.remove('-translate-x-1'), 150);
        });

        // Reset error state on input
        loginForm.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', () => {
                if (!errorAlert.classList.contains('hidden')) {
                    errorAlert.classList.add('hidden');
                    loginForm.querySelectorAll('input[required]').forEach(i => {
                        i.classList.add('border-outline-variant');
                        i.classList.remove('border-error');
                    });
                }
            });
        });
    </script>
</body></html>
