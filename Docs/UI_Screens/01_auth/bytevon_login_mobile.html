<!-- Middle: Login Card -->

<form class="space-y-5" id="loginForm">

<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-transparent border border-outline rounded-lg focus:ring-2 focus:ring-secondary-container focus:border-secondary-container outline-none transition-all font-body-md text-body-md" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-secondary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-transparent border border-outline rounded-lg focus:ring-2 focus:ring-secondary-container focus:border-secondary-container outline-none transition-all font-body-md text-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" id="togglePassword" type="button">

</div>
</div>
<!-- Remember Me -->

<input class="w-4 h-4 text-secondary border-outline rounded focus:ring-secondary" id="remember" name="remember" type="checkbox"/>
<label class="font-label-md text-label-md text-on-surface-variant" for="remember">Remember this device</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-title-lg text-title-lg py-4 rounded-lg hover:bg-primary-container transition-all shadow-md active:scale-[0.98] mt-2" type="submit">
                    Login to Dashboard

<script>
        // Password visibility toggle logic
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');
        const passwordIcon = document.querySelector('#passwordIcon');

        togglePassword.addEventListener('click', function (e) {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            passwordIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });

        // Form submission simulation
        const loginForm = document.querySelector('#loginForm');
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="flex items-center justify-center"><svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Authenticating...</span>';
            
            setTimeout(() => {
                btn.innerHTML = 'Success!';
                btn.classList.replace('bg-primary', 'bg-green-600');
                setTimeout(() => {
                    alert('Login successful! Redirecting to dashboard...');
                    btn.disabled = false;
                    btn.textContent = originalText;
                    btn.classList.replace('bg-green-600', 'bg-primary');
                }, 1000);
            }, 1500);
        });
    </script>
