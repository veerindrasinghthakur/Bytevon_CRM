<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bytevon Workflow Explorer</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
:root{--route:#3b82f6;--service:#22c55e;--repository:#f59e0b;--model:#a855f7;--db:#7c3aed;--side:#ef4444;--client:#64748b;--response:#14b8c7}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#0f172a;color:#e2e8f0}
header{padding:16px 24px;background:#1e293b;border-bottom:1px solid #334155}
header h1{margin:0;font-size:20px}header p{margin:4px 0 0;color:#94a3b8;font-size:13px}
header a{color:#7dd3fc}
#wrap{display:flex;height:calc(100vh - 130px)}
#graph{flex:1;min-width:0}
#panel{width:340px;background:#1e293b;border-left:1px solid #334155;padding:16px;overflow:auto}
#panel h2{font-size:15px;margin:0 0 8px}#panel dl{font-size:13px}#panel dt{color:#94a3b8}#panel dd{margin:0 0 8px;word-break:break-all}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}
.legend{display:flex;gap:10px;flex-wrap:wrap;padding:8px 24px;font-size:12px;background:#0f172a}
.legend span i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
table.nodes{width:100%;border-collapse:collapse;font-size:12px;margin:0}
table.nodes td,table.nodes th{border:1px solid #334155;padding:6px 8px;text-align:left}
.unres{color:#fbbf24;font-weight:700}
footer{padding:8px 24px;font-size:12px;color:#94a3b8}
footer a{color:#7dd3fc}

#crumbs{display:flex;align-items:center;gap:8px;padding:10px 24px;background:#0f172a;font-size:14px}
#crumbs button{background:none;border:none;color:#7dd3fc;cursor:pointer;font-size:14px;padding:2px 4px}
#crumbs button:hover{text-decoration:underline}
#crumbs .sep{color:#475569}
#backbtn{margin-left:auto;background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:4px 12px;cursor:pointer;font-size:13px}
#backbtn:hover{background:#334155}
#graph{transition:opacity .18s ease,transform .18s ease}
#graph.zoom{opacity:0;transform:scale(.96)}
#leveldesc{padding:0 24px;color:#94a3b8;font-size:13px}
</style></head>

<script>
(function(){
var COLORS={client:"#64748b",route:"#3b82f6",service:"#22c55e",repository:"#f59e0b",model:"#a855f7",db:"#7c3aed","side-effect":"#ef4444",response:"#14b8c7",util:"#0ea5e9"};
var MODULE_COLOR="#22c55e", WF_COLOR="#3b82f6";
var path=[]; // [] | [modId] | [modId, wfId]
var net=null, curDetail=null;
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function shortStep(s){s=String(s||"");return s.length>64?s.slice(0,61)+"...":s;}
function edgeColor(t){return t==="triggers"?"#ef4444":t==="writes"?"#a855f7":t==="reads"?"#38bdf8":"#94a3b8";}
function setData(nodes,edges,hier){
  var nd=new vis.DataSet(nodes), ed=new vis.DataSet(edges);
  if(!net){
    net=new vis.Network(document.getElementById("graph"),{nodes:nd,edges:ed},
      {layout:{hierarchical:{direction:"UD",sortMethod:"directed",nodeSpacing:140,levelSeparation:110}},
       physics:false,interaction:{hover:true,navigationButtons:true}});
    net.on("click",onClick);
  } else {
    net.setOptions({layout:{hierarchical:hier?{direction:"UD",sortMethod:"directed",nodeSpacing:140,levelSeparation:110}:false},physics:!hier});
    net.setData({nodes:nd,edges:ed});
    if(!hier){net.stabilize();}
  }
}
function anim(fn){
  var g=document.getElementById("graph");
  g.classList.add("zoom");
  setTimeout(function(){fn();g.classList.remove("zoom");},180);
}
function findMod(id){for(var i=0;i<explorerData.modules.length;i++)if(explorerData.modules[i].id===id)return explorerData.modules[i];return null;}
function renderModules(){
  var nodes=explorerData.modules.map(function(m){
    return {id:"mod:"+m.id,label:m.label+"\n("+m.workflows.length+")",shape:"box",margin:10,
      color:{background:MODULE_COLOR,border:"#0f172a"},font:{color:"#fff",size:14},title:esc(m.label)};});
  var edges=[];
  explorerData.modules.forEach(function(m){
    (m.dependsOn||[]).forEach(function(d){edges.push({from:"mod:"+m.id,to:"mod:"+d,arrows:"to",color:{color:"#94a3b8"},font:{color:"#94a3b8",size:11}});});
  });
  setData(nodes,edges,true);
  setDesc("Level 0 — Module map. Click a module to drill into its workflows.");
  crumb(); showPanelHome();
}
function renderWorkflows(modId){
  var m=findMod(modId);if(!m)return;
  var nodes=m.workflows.map(function(w){
    return {id:"wf:"+w.id,label:w.label,shape:"box",margin:8,
      color:{background:WF_COLOR,border:"#0f172a"},font:{color:"#fff",size:13},title:esc(w.entry_route||w.label)};});
  setData(nodes,[],true);
  setDesc("Level 1 — Workflows in "+m.label+". Click a workflow for its call graph.");
  crumb(); showPanelHome();
}
function renderDetail(modId,wfId){
  var m=findMod(modId),w=null;
  if(m)m.workflows.forEach(function(x){if(x.id===wfId)w=x;});
  if(!w)return;
  var g=w.graph;
  var nodes=g.nodes.map(function(n){
    return {id:n.id,label:(n.unresolved?"[?] ":"")+shortStep(n.business_step),
      color:{background:COLORS[n.layer]||"#475569",border:"#0f172a"},
      font:{color:"#fff",size:13},shape:"box",margin:8,title:esc(n.business_step)};});
  var edges=g.edges.map(function(e,i){
    var c=edgeColor(e.type);
    return {id:"e"+i,from:e.from,to:e.to,arrows:"to",color:{color:c},label:e.label||e.type||"",font:{color:c,size:11}};});
  setData(nodes,edges,true);
  curDetail=g;
  setDesc("Level 2 — "+m.label+" > "+w.label+" ("+esc(w.entry_route||"")+"). Click a node for file/function/line.");
  crumb(); fillTable(g);
}
function onClick(p){
  if(!p.nodes.length)return;
  var id=p.nodes[0];
  if(path.length===0&&id.indexOf("mod:")===0){var m=id.slice(4);anim(function(){path=[m];renderWorkflows(m);});}
  else if(path.length===1&&id.indexOf("wf:")===0){var w=id.slice(3);anim(function(){path=[path[0],w];renderDetail(path[0],w);});}
  else if(path.length===2){showDetail(id);}
}
function go(level){
  anim(function(){
    if(level===0){path=[];curDetail=null;renderModules();}
    else if(level===1){path=[path[0]];curDetail=null;renderWorkflows(path[0]);}
  });
}
function back(){if(path.length===2)go(1);else if(path.length===1)go(0);}
function crumb(){
  var c=document.getElementById("crumbs"),h="";
  h+='<button data-lv="0">All Modules</button>';
  if(path.length>=1){var m=findMod(path[0]);h+='<span class="sep">&gt;</span><button data-lv="1">'+esc(m?m.label:path[0])+"</button>";}
  if(path.length>=2){var m2=findMod(path[0]),w=null;if(m2)m2.workflows.forEach(function(x){if(x.id===path[1])w=x;});h+='<span class="sep">&gt;</span><span>'+esc(w?w.label:path[1])+"</span>";}
  h+='<button id="backbtn" '+(path.length?"":"disabled")+'>&larr; Back</button>';
  c.innerHTML=h;
  var bs=c.querySelectorAll("button[data-lv]");
  for(var i=0;i<bs.length;i++)(function(b){b.onclick=function(){go(parseInt(b.getAttribute("data-lv"),10));};})(bs[i]);
  var bb=document.getElementById("backbtn");if(bb)bb.onclick=back;
}
function setDesc(t){document.getElementById("leveldesc").textContent=t;}
function showPanelHome(){document.getElementById("detail").innerHTML='<p style="color:#94a3b8">Click a node to drill deeper.</p>';var tb=document.getElementById("nodetable");if(tb)tb.innerHTML="";}
function fillTable(g){
  var tb=document.getElementById("nodetable");if(!tb)return;
  tb.innerHTML="<tr><th>ID</th><th>Step</th><th>Layer</th><th>Ref</th></tr>"+g.nodes.map(function(n){
    return "<tr><td>"+n.id+"</td><td>"+esc(n.business_step)+(n.unresolved?' <span class="unres">[unresolved]</span>':"")+"</td><td>"+n.layer+"</td><td>"+esc(n.file||"")+(n.function?" :: "+esc(n.function):"")+(n.line?" :"+n.line:"")+"</td></tr>";}).join("");
}
function showDetail(id){
  if(!curDetail)return;
  var n=null;curDetail.nodes.forEach(function(x){if(x.id===id)n=x;});
  if(!n)return;
  var h="<h2>"+n.id+" &middot; "+n.layer+"</h2><dl>";
  h+="<dt>Business step</dt><dd>"+esc(n.business_step)+"</dd>";
  h+="<dt>File</dt><dd>"+esc(n.file||"—")+"</dd>";
  h+="<dt>Function</dt><dd>"+esc(n.function||"—")+"</dd>";
  h+="<dt>Line</dt><dd>"+(n.line||"—")+"</dd>";
  if(n.table)h+="<dt>Table</dt><dd>"+esc(n.table)+"</dd>";
  if(n.unresolved)h+='<dt>Status</dt><dd class="unres">UNRESOLVED — '+esc(n.note||"")+"</dd>";
  h+="</dl>";
  document.getElementById("detail").innerHTML=h;
}
document.addEventListener("DOMContentLoaded",function(){
  if(!window.vis){document.getElementById("graph").innerHTML="<p style='padding:24px'>vis-network CDN failed to load (offline?). Drill-down needs the CDN.</p>";return;}
  renderModules();
  document.addEventListener("keydown",function(e){if(e.key==="Escape")back();});
});
window.__go=go;
})();
</script>
