<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Session Expired | Bytevon</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">tailwind.config = {darkMode: "class", theme: {extend: {colors: {"on-tertiary-container": "#848789", "on-primary-fixed-variant": "#2f486a", "on-error": "#ffffff", "on-tertiary": "#ffffff", "primary-fixed-dim": "#afc8f0", "tertiary-fixed": "#e0e3e5", "tertiary-fixed-dim": "#c4c7c9", "surface-bright": "#f8f9ff", "on-secondary-fixed": "#001a41", "tertiary-container": "#1c1f21", "error-container": "#ffdad6", "surface-tint": "#476083", "surface-container-low": "#eff4ff", "on-surface": "#0b1c30", "primary-container": "#001f3f", "on-tertiary-fixed": "#191c1e", tertiary: "#040607", "surface-variant": "#d3e4fe", "inverse-primary": "#afc8f0", "surface-dim": "#cbdbf5", "outline-variant": "#c4c6cf", surface: "#f8f9ff", primary: "#000613", "on-secondary-container": "#fefcff", "on-primary-container": "#6f88ad", "secondary-fixed": "#d8e2ff", outline: "#74777f", "on-background": "#0b1c30", "surface-container-highest": "#d3e4fe", "on-primary-fixed": "#001c3a", "on-tertiary-fixed-variant": "#444749", error: "#ba1a1a", "on-primary": "#ffffff", "inverse-on-surface": "#eaf1ff", "surface-container-high": "#dce9ff", "inverse-surface": "#213145", "secondary-container": "#0070ea", "primary-fixed": "#d4e3ff", "on-secondary-fixed-variant": "#004493", "secondary-fixed-dim": "#adc7ff", secondary: "#0059bb", "on-surface-variant": "#43474e", "on-secondary": "#ffffff", "on-error-container": "#93000a", "surface-container": "#e5eeff", background: "#f8f9ff", "surface-container-lowest": "#ffffff"}, borderRadius: {DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px"}, fontFamily: {"label-md": ["Inter"], "headline-md": ["Inter"], "body-md": ["Inter"], "label-sm": ["Inter"]}, fontSize: {"label-md": ["0.875rem", {lineHeight: "1.25rem", fontWeight: "500"}], "headline-md": ["1.75rem", {lineHeight: "2.25rem", fontWeight: "700"}], "body-md": ["0.875rem", {lineHeight: "1.25rem"}], "label-sm": ["0.75rem", {lineHeight: "1rem", fontWeight: "500"}]}}}}</script>
<style>
.material-symbols-outlined {
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
}
.glass-effect {
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
</style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<main class="flex-1 flex items-center justify-center p-4">
<div class="glass-effect rounded-xl border border-outline-variant/30 shadow-lg p-8 max-w-md w-full text-center animate-in fade-in zoom-in">
<div class="w-16 h-16 rounded-full bg-error-container text-error flex items-center justify-center mx-auto mb-6">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">timer_off</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">Session Expired</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-8">Your session has timed out due to inactivity. Please sign in again to continue.</p>
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-3 rounded-lg hover:opacity-90 transition active:scale-[0.98]">
Sign in again
</button>
</div>
</main>
<footer class="flex flex-col md:flex-row justify-center items-center gap-4 w-full py-6 bg-transparent">
<div class="font-label-sm text-label-sm text-on-surface-variant">© 2024 Bytevon Systems. All rights reserved.</div>
<div class="flex gap-4">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition underline" href="#">Privacy Policy</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition underline" href="#">Terms of Service</a>
</div>
</footer>
<style>
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
.animate-in { animation-duration: 0.5s; animation-fill-mode: both; }
.fade-in { animation-name: fadeIn; }
.zoom-in { animation-name: zoomIn; }
</style>
<script>
document.querySelectorAll('button').forEach(button => {
  button.addEventListener('mousedown', () => { button.style.transform = 'scale(0.98)'; });
  button.addEventListener('mouseup', () => { button.style.transform = 'scale(1)'; });
  button.addEventListener('mouseleave', () => { button.style.transform = 'scale(1)'; });
});
window.addEventListener('mousemove', (e) => {
  const x = (e.clientX / window.innerWidth) - 0.5;
  const y = (e.clientY / window.innerHeight) - 0.5;
  const card = document.querySelector('.glass-effect');
  if (card) {
    card.style.transform = `perspective(1000px) rotateY(${x * 2}deg) rotateX(${-y * 2}deg)`;
  }
});
</script>
</body></html>
